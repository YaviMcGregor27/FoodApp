name: Pruebas

on:
  push:
  pull_request:

jobs:
  prototipo:
    name: Prototipo (tipos y pruebas)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: prototipo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: prototipo/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  esquema:
    name: Esquema SQL (aislamiento y reglas de inventario)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: foodapp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: foodapp_test
    steps:
      - uses: actions/checkout@v4
      - run: psql -v ON_ERROR_STOP=1 -f db/schema.sql -f db/test_rls.sql
