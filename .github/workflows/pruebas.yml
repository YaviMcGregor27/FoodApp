name: Pruebas

on:
  push:
  pull_request:

jobs:
  dominio:
    name: Dominio (tipos y pruebas)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck -w @foodapp/dominio
      - run: npm test -w @foodapp/dominio

  supabase:
    name: Base de datos (migraciones, aislamiento y reglas)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: foodapp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: foodapp_test
    steps:
      - uses: actions/checkout@v4
      - name: Con los permisos por defecto de Supabase
        run: supabase/pruebas/ejecutar.sh
      - name: Sin permisos por defecto (configuración del proyecto real)
        run: |
          createdb foodapp_test_sin_permisos
          PGDATABASE=foodapp_test_sin_permisos SIN_PERMISOS_POR_DEFECTO=1 supabase/pruebas/ejecutar.sh

  movil:
    name: App móvil (tipos, pruebas, empaquetado y extremo a extremo)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/movil
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
        working-directory: .
      - run: npm run typecheck
      - run: npm test
      - run: npm run verificar:android
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
